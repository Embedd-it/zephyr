CONFIG_DMA=y

# The Async callback is invoked in thread context from a workqueue, so the
# RX buffers cannot be provided within one character time at higher
# baudrates with 1-byte buffers; the variable length buffers test needs to
# be slowed down
CONFIG_VAR_LENGTH_BUFFER_TEST_BAUDRATE_LIMIT=19200
