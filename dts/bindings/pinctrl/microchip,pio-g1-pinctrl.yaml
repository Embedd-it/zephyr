title: Microchip PIO g1 driver.

description: |
  Microchip pinctrl g1 driver.

  This driver is responsible for configuring
  and managing the PIO peripheral in Microchip microcontrollers.
  The supported devices :
    - module name="PIO" id="11004" version="V"

compatible: "microchip,pio-g1-pinctrl"

include: base.yaml

properties:
  "#address-cells":
    required: true
    const: 1
  "#size-cells":
    required: true
    const: 1

child-binding:
  description: |
    Each child node defines the configuration for a particular state.
  child-binding:
    description: |
      The grandchild nodes group pins that share the same pin configuration.

    include:
      - name: pincfg-node.yaml
        property-allowlist:
          - bias-pull-up
          - bias-pull-down
          - drive-strength
          - drive-open-drain

    properties:
      pinmux:
        required: true
        type: array
        description: |
          An array of pins sharing the same group properties. The pins should
          be defined using pre-defined macros.
      drive-strength:
        enum:
          - 0
          - 1
        default: 0
        description: |
          Configures the output drive strength of an output pin.
            0: low drive strength.
            1: high drive strength.
