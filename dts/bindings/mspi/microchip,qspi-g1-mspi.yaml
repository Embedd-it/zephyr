title: Microchip MSPI/QSPI g1 driver

description: |
  Microchip MSPI/QSPI g1 driver
  The supported devices :
    - module name="QSPI" id="11171" version="J"

compatible: "microchip,qspi-g1-mspi"

include: [base.yaml, pinctrl-device.yaml, mspi-controller.yaml]

properties:
  reg:
    required: true

  reg-names:
    required: true

  interrupts:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  clocks:
    required: true

  clock-frequency:
    required: true

  dmas:
    description: |
      Each specifier consists of a phandle to the DMA controller
      and the channel number.
      The final cell is required but unused and can be set to any value.

      Example:
         dmas = <&xdmac 1 0>;

  dma-names:
    description: |
      Must be set to

      Example:
         dma-names = "txrx";
