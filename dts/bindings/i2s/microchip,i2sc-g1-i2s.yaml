title: Microchip I2SC g1 driver

description: |
  Microchip I2SC g1 driver
  The supported devices :
    - module name="QSPI" id="11241" version="N"

compatible: "microchip,i2sc-g1-i2s"

include: [i2s-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  loopback:
    type: boolean
    description: |
      Connects TX to RX internally creating a loop back connection. Useful
      for testing.

  mclk-ratio:
    type: int
    description: |
      Ratio between MCLK / CLK. Value 0 disables MCLK

  dmas:
    required: true
    description: |
      TX & RX dma specifiers.  Each specifier will have a phandle
      reference to the dma controller, the channel number, and peripheral
      trigger source. The channel number is arbitrary but must not be
      reused. The number of channels available is device dependent.

      For example dmas for TX and RX may look like
         dmas = <&xdmac 1 DMA_PERID_I2SC1_TX_L>, <&xdmac 2 DMA_PERID_I2SC1_RX_L>;

  dma-names:
    required: true
    description: |
      This should be "tx" and "rx" and should match the order given for
      dmas.

      For example using the example dmas, an example dma-names would be
         dma-names = "tx", "rx";
